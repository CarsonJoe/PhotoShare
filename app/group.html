<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Carson's Photos</title>
    <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="app-icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script>(function(){var t=localStorage.getItem('ps-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
  </head>
  <body class="page-group" aria-busy="true">

    <header class="site-header shell" data-reveal>
      <div class="header-left">
        <a class="back-link" href="index.html" aria-label="Back to albums">Back</a>
      </div>
      <div class="header-center" id="groupHeaderTitle">Loading album</div>
      <div class="header-right">
        <button id="themeToggleBtn" class="header-icon-btn" title="Toggle theme" aria-label="Switch to dark mode">◐</button>
        <button id="fullscreenBtn" class="header-icon-btn" title="Toggle fullscreen" aria-label="Enter fullscreen">⛶</button>
        <button id="btnSelectHeader" class="btn header-btn" type="button">Select</button>
      </div>
    </header>

    <main class="container">
      <section class="hero shell hero-group" data-reveal>
        <div class="hero-copy hero-copy-minimal">
          <h2 id="groupTitle" class="hero-title album-title">Loading...</h2>
          <p class="hero-meta-line" id="galleryMeta">0 photos / Pending</p>
        </div>
      </section>

      <section class="section-shell gallery-shell" data-reveal>
        <div id="photos" class="photos-grid" aria-live="polite"></div>
        <div id="emptyState" class="empty shell" hidden>
          <p>Album not found or has no photos.</p>
        </div>
      </section>
    </main>

    <div class="bottom-bar" id="bottomBar" aria-live="polite">
      <div class="bottom-inner">
        <div class="bottom-summary">
          <span class="eyebrow">Selection</span>
          <strong id="selectionStatus">Choose frames to download or share.</strong>
        </div>
        <div class="bottom-actions">
          <button id="btnSelectAll" class="btn action-btn action-btn-select" type="button">
            Select All
          </button>
          <button id="btnShare" class="btn action-btn action-btn-share" type="button" hidden disabled>
            Share
          </button>
          <button
            id="btnDownload"
            class="btn primary action-btn action-btn-download"
            type="button"
            disabled
          >
            Download
          </button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

    <div id="shareModal" class="modal" hidden>
      <div class="modal-backdrop"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
        <h3 id="shareTitle">Prepare to Share</h3>
        <p id="shareSubtitle" class="muted"></p>
        <form id="shareForm" class="share-form">
          <label class="radio">
            <input type="radio" name="preset" value="large" checked />
            <span>Large (~2048px)</span>
          </label>
          <label class="radio">
            <input type="radio" name="preset" value="medium" />
            <span>Medium (~1280px)</span>
          </label>
          <label class="radio">
            <input type="radio" name="preset" value="small" />
            <span>Small (~800px)</span>
          </label>
          <label class="radio">
            <input type="radio" name="preset" value="original" />
            <span>Original size</span>
          </label>
        </form>
        <p id="shareNote" class="muted"></p>
        <div class="modal-actions">
          <button id="shareCancel" class="btn">Cancel</button>
          <button id="shareConfirm" class="btn primary">Share</button>
        </div>
      </div>
    </div>

    <div id="lightbox" class="lightbox" hidden aria-hidden="true">
      <div class="lb-topbar lb-chrome">
        <button class="lb-action-btn lb-close" aria-label="Close">Close</button>
        <div class="lb-meta">
          <span id="lbAlbumName" class="lb-album-name"></span>
          <span id="lbCounter" class="lb-counter">1 / 1</span>
        </div>
        <div class="lb-actions">
          <button id="lbSelectBtn" class="lb-action-btn" type="button">Select</button>
          <button id="lbShareBtn" class="lb-action-btn" type="button">Share</button>
          <button id="lbDownloadBtn" class="lb-action-btn" type="button">Download</button>
        </div>
      </div>

      <div id="lbStage" class="lb-stage">
        <button class="lb-btn lb-prev" aria-label="Previous"></button>
        <div class="lb-media-shell">
          <div id="lbTrack" class="lb-track">
            <div class="lb-slide">
              <img id="lbPrevImage" class="lb-image" alt="" />
            </div>
            <div class="lb-slide">
              <img id="lightboxImage" class="lb-image" alt="Full size" />
            </div>
            <div class="lb-slide">
              <img id="lbNextImage" class="lb-image" alt="" />
            </div>
          </div>
          <div id="lbProgress" class="lb-progress" hidden>Loading original...</div>
        </div>
        <button class="lb-btn lb-next" aria-label="Next"></button>
      </div>

      <div class="lb-bottombar lb-chrome">
        <div id="lbFilmstrip" class="lb-filmstrip" aria-label="Photo strip"></div>
      </div>
    </div>

    <footer class="site-footer">
      <span id="generatedAt"></span>
    </footer>

    <script src="./photos-inline.js"></script>
    <script src="./main.js"></script>
    <script src="./group.js"></script>
    <script>
      (function () {
        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById('themeToggleBtn');
        const fsBtn = document.getElementById('fullscreenBtn');
        const themeMeta = document.querySelector('meta[name="theme-color"]');

        function applyTheme(theme) {
          htmlEl.classList.add('theme-transition');
          htmlEl.setAttribute('data-theme', theme);
          localStorage.setItem('ps-theme', theme);
          if (themeMeta) themeMeta.content = theme === 'dark' ? '#0f0e0d' : '#ffffff';
          themeBtn.textContent = theme === 'dark' ? '◑' : '◐';
          themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
          window.setTimeout(() => htmlEl.classList.remove('theme-transition'), 380);
        }

        themeBtn.addEventListener('click', () => {
          applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        applyTheme(localStorage.getItem('ps-theme') || 'light');

        function syncFsBtn() {
          const isFs = Boolean(document.fullscreenElement);
          fsBtn.textContent = isFs ? '⊡' : '⛶';
          fsBtn.setAttribute('aria-label', isFs ? 'Exit fullscreen' : 'Enter fullscreen');
          fsBtn.title = isFs ? 'Exit fullscreen' : 'Enter fullscreen';
        }

        fsBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });

        document.addEventListener('fullscreenchange', syncFsBtn);
        syncFsBtn();
      })();
    </script>
  </body>
</html>
