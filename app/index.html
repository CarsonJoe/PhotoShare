<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Carson's Photos</title>
    <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="app-icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <script>(function(){var t=localStorage.getItem('ps-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
  </head>
  <body class="page-home" aria-busy="true">

    <header class="site-header shell" data-reveal>
      <div class="header-left">
        <h1 class="site-title">Carson's Photos</h1>
      </div>
      <div class="header-center" id="headerMeta"></div>
      <nav class="header-right site-nav" aria-label="Home sections">
        <a href="#favorites">Favorites</a>
        <a href="#collections">Collections</a>
        <a href="texture-studio.html">Textures</a>
        <button id="themeToggleBtn" class="header-icon-btn" title="Toggle theme" aria-label="Switch to dark mode">◐</button>
        <button id="fullscreenBtn" class="header-icon-btn" title="Toggle fullscreen" aria-label="Enter fullscreen">⛶</button>
      </nav>
    </header>

    <main class="container home-container">
      <section id="favorites" class="section-shell favorites-section" data-reveal>
        <div id="favoritesGrid" class="favorites-grid" aria-live="polite"></div>
        <div id="favoritesEmpty" class="empty minimal-empty" hidden>
          <p>Manage favorites in the local photo manager.</p>
        </div>
      </section>

      <section id="collections" class="section-shell collections-section" data-reveal>
        <div class="section-heading home-section-heading">
          <div>
            <p class="eyebrow">Archive</p>
            <h2 class="section-title">Collections</h2>
          </div>
        </div>
        <div id="groups" class="groups-grid" aria-live="polite"></div>
        <div id="emptyState" class="empty shell" hidden>
          <p>No photo albums found. Add folders under <code>/photos</code> and run <code>publish.bat</code>.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span id="generatedAt"></span>
    </footer>

    <script src="./photos-inline.js"></script>
    <script src="./main.js"></script>
    <script>
      (function () {
        const htmlEl = document.documentElement;
        const themeBtn = document.getElementById('themeToggleBtn');
        const fsBtn = document.getElementById('fullscreenBtn');
        const themeMeta = document.querySelector('meta[name="theme-color"]');

        function applyTheme(theme) {
          htmlEl.classList.add('theme-transition');
          htmlEl.setAttribute('data-theme', theme);
          localStorage.setItem('ps-theme', theme);
          if (themeMeta) themeMeta.content = theme === 'dark' ? '#0f0e0d' : '#ffffff';
          themeBtn.textContent = theme === 'dark' ? '◑' : '◐';
          themeBtn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
          window.setTimeout(() => htmlEl.classList.remove('theme-transition'), 380);
        }

        themeBtn.addEventListener('click', () => {
          applyTheme(htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        });

        const savedTheme = localStorage.getItem('ps-theme') || 'light';
        applyTheme(savedTheme);

        function syncFsBtn() {
          const isFs = Boolean(document.fullscreenElement);
          fsBtn.textContent = isFs ? '⊡' : '⛶';
          fsBtn.setAttribute('aria-label', isFs ? 'Exit fullscreen' : 'Enter fullscreen');
          fsBtn.title = isFs ? 'Exit fullscreen' : 'Enter fullscreen';
        }

        fsBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
          } else {
            document.exitFullscreen().catch(() => {});
          }
        });

        document.addEventListener('fullscreenchange', syncFsBtn);
        syncFsBtn();
      })();
    </script>
    <script>
      window.addEventListener('DOMContentLoaded', async () => {
        const { PhotoShare } = window;
        const groupsEl = document.getElementById('groups');
        const favoritesGridEl = document.getElementById('favoritesGrid');
        const favoritesEmptyEl = document.getElementById('favoritesEmpty');
        const emptyEl = document.getElementById('emptyState');
        const genEl = document.getElementById('generatedAt');
        let favoritesRotationIndex = 0;
        let favoritesRotationTimer = null;
        let favoritesResizeTimer = null;
        let favoritesTileCursor = 0;
        let favoritesShuffleSeed = Math.random();

        PhotoShare.setBusyState(true, 'Loading archive...');
        PhotoShare.renderSkeletons(groupsEl, { count: 6, kind: 'group' });
        PhotoShare.revealElements(document);

        const data = await PhotoShare.loadManifest();
        const groups = (data && Array.isArray(data.groups) ? data.groups : []).filter(
          (group) => group.items && group.items.length
        );
        const publicGroups = groups.filter((group) => group.visibility !== 'private');

        if (!groups.length) {
          groupsEl.innerHTML = '';
          emptyEl.hidden = false;
          genEl.textContent = '';
          PhotoShare.setBusyState(false, 'Archive ready');
          PhotoShare.revealElements(document);
          return;
        }

        genEl.textContent = data.generatedAt
          ? `Updated ${PhotoShare.formatTimestamp(data.generatedAt, { includeTime: true })}`
          : '';

        groupsEl.innerHTML = '';
        renderFavorites(groups);

        for (const [index, group] of publicGroups.entries()) {
          const card = document.createElement('a');
          card.className = 'group-card';
          card.href = `group.html?g=${encodeURIComponent(group.id)}`;

          const media = document.createElement('div');
          media.className = 'group-card-media';

          const img = document.createElement('img');
          img.loading = index < 3 ? 'eager' : 'lazy';
          img.decoding = 'async';
          img.fetchPriority = index < 3 ? 'high' : 'auto';
          img.alt = `${group.name} cover`;
          img.src = PhotoShare.relativeAsset(group.coverThumb || group.cover);

          const body = document.createElement('div');
          body.className = 'group-card-body';

          const copy = document.createElement('div');
          copy.className = 'group-card-copy';

          const title = document.createElement('h3');
          title.className = 'group-card-title';
          title.textContent = group.name;

          const meta = document.createElement('p');
          meta.className = 'group-card-meta';
          meta.textContent = `${group.items.length} frame${group.items.length === 1 ? '' : 's'}`;

          copy.append(title, meta);
          body.append(copy);
          media.append(img);
          card.append(media, body);
          groupsEl.appendChild(card);
        }

        window.addEventListener('photoshare:favorites-changed', () => renderFavorites(groups));
        window.addEventListener('resize', () => {
          if (favoritesResizeTimer) clearTimeout(favoritesResizeTimer);
          favoritesResizeTimer = setTimeout(() => renderFavorites(groups), 180);
        });
        PhotoShare.setBusyState(false, 'Archive ready');

        function renderFavorites(sourceGroups) {
          const favorites = shuffleFavorites(PhotoShare.getFavoriteItems(sourceGroups));
          favoritesGridEl.innerHTML = '';
          favoritesTileCursor = 0;
          favoritesGridEl.hidden = favorites.length === 0;
          favoritesEmptyEl.hidden = favorites.length > 0;

          if (favoritesRotationTimer) {
            clearInterval(favoritesRotationTimer);
            favoritesRotationTimer = null;
          }

          if (!favorites.length) return;

          mountFavorites(favorites);

          if (favorites.length > getVisibleFavoriteCount(favorites.length)) {
            favoritesRotationTimer = setInterval(() => {
              rotateSimilarFavorite(favorites);
            }, 7000);
          }
        }

        function shuffleFavorites(items) {
          const shuffled = items.map((item, index) => ({ item, index }));
          let seed = favoritesShuffleSeed || 0.5;
          const random = () => {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
          };

          for (let index = shuffled.length - 1; index > 0; index -= 1) {
            const swapIndex = Math.floor(random() * (index + 1));
            [shuffled[index], shuffled[swapIndex]] = [shuffled[swapIndex], shuffled[index]];
          }

          return shuffled.map(({ item, index }) => ({
            ...item,
            favoriteIndex: index,
          }));
        }

        function getVisibleFavoriteCount(total) {
          const width = window.innerWidth || document.documentElement.clientWidth || 1200;
          const desired = width < 640 ? 4 : width < 980 ? 5 : 7;
          return Math.max(1, Math.min(total, desired));
        }

        function getAspect(item) {
          const width = Number(item.width) || 3;
          const height = Number(item.height) || 2;
          return Math.max(0.45, Math.min(2.8, width / height));
        }

        function getObjectPosition(item, index) {
          const aspect = getAspect(item);
          if (aspect < 0.78) return 'center 38%';
          if (aspect > 1.8) return index % 2 ? '55% center' : '45% center';
          return 'center center';
        }

        function getVisibleFavorites(favorites) {
          const count = getVisibleFavoriteCount(favorites.length);
          return Array.from({ length: count }, (_, offset) => {
            const index = (favoritesRotationIndex + offset) % favorites.length;
            return { item: favorites[index], originalIndex: favorites[index].favoriteIndex ?? index };
          });
        }

        function getActiveFavoriteIndices() {
          return Array.from(favoritesGridEl.querySelectorAll('.favorite-tile'))
            .map((tile) => Number(tile.dataset.favoriteIndex))
            .filter(Number.isFinite);
        }

        function findSimilarTile(candidate, activeIndices) {
          const candidateAspect = getAspect(candidate.item);
          const activeSet = new Set(activeIndices);
          const candidates = Array.from(favoritesGridEl.querySelectorAll('.favorite-tile'))
            .filter((tile) => !tile.classList.contains('is-swapping'))
            .map((tile) => {
              const activeIndex = Number(tile.dataset.favoriteIndex);
              if (!activeSet.has(activeIndex)) return null;
              const activeAspect = Number(tile.dataset.aspect);
              const distance = Math.abs(activeAspect - candidateAspect);
              const tolerance = Math.max(0.14, Math.min(activeAspect, candidateAspect) * 0.22);
              const slot = Number(tile.dataset.tileSlot) || 0;
              const slotDistance =
                (slot - favoritesTileCursor + Math.max(activeIndices.length, 1)) %
                Math.max(activeIndices.length, 1);
              return distance <= tolerance ? { tile, distance, slotDistance } : null;
            })
            .filter(Boolean)
            .sort((a, b) => a.slotDistance - b.slotDistance || a.distance - b.distance);

          return candidates[0] ? candidates[0].tile : null;
        }

        function getNextSidelinedFavorite(favorites, activeIndices) {
          const activeSet = new Set(activeIndices);
          for (let offset = 1; offset <= favorites.length; offset += 1) {
            const index = (favoritesRotationIndex + offset) % favorites.length;
            const originalIndex = favorites[index].favoriteIndex ?? index;
            if (!activeSet.has(originalIndex)) {
              return { item: favorites[index], originalIndex };
            }
          }
          return null;
        }

        function rotateSimilarFavorite(favorites) {
          const activeIndices = getActiveFavoriteIndices();
          if (activeIndices.length >= favorites.length) return;

          const replacement = getNextSidelinedFavorite(favorites, activeIndices);
          if (!replacement) return;

          const tile = findSimilarTile(replacement, activeIndices);
          favoritesRotationIndex = (replacement.originalIndex + 1) % favorites.length;

          if (!tile) return;
          favoritesTileCursor =
            ((Number(tile.dataset.tileSlot) || 0) + 1) % Math.max(activeIndices.length, 1);
          swapFavoriteTile(tile, replacement);
        }

        function swapFavoriteTile(tile, replacement) {
          const oldImg = tile.querySelector('img');
          if (!oldImg) return;

          const newImg = document.createElement('img');
          newImg.loading = 'lazy';
          newImg.decoding = 'async';
          newImg.alt = '';
          newImg.src = PhotoShare.relativeAsset(replacement.item.thumb || replacement.item.src);
          newImg.style.objectPosition = getObjectPosition(replacement.item, replacement.originalIndex);
          newImg.className = 'favorite-tile-next';

          const commit = () => {
            tile.href = `group.html?g=favorites&p=${replacement.originalIndex + 1}`;
            tile.dataset.favoriteIndex = String(replacement.originalIndex);
            tile.dataset.aspect = String(getAspect(replacement.item));
            tile.style.setProperty('--tile-weight', String(getAspect(replacement.item)));
            tile.setAttribute(
              'aria-label',
              `${replacement.item.sourceGroupName || 'Favorite'} photo ${
                replacement.originalIndex + 1
              }`
            );
            oldImg.remove();
            newImg.classList.remove('favorite-tile-next');
            tile.classList.remove('is-swapping');
          };

          tile.classList.add('is-swapping');
          tile.appendChild(newImg);

          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              newImg.classList.add('is-visible');
              oldImg.classList.add('is-fading');
            });
          });

          window.setTimeout(commit, 720);
        }

        function splitFavoriteRows(visible) {
          if (visible.length <= 1) return [visible, []];
          const topCount = Math.max(1, Math.floor(visible.length / 2));
          return [visible.slice(0, topCount), visible.slice(topCount)];
        }

        function mountFavorites(favorites) {
          const rows = splitFavoriteRows(getVisibleFavorites(favorites));
          favoritesGridEl.innerHTML = '';
          let tileSlot = 0;

          rows.forEach((row, rowIndex) => {
            const rowEl = document.createElement('div');
            rowEl.className = 'favorites-row';
            rowEl.dataset.row = String(rowIndex + 1);

            row.forEach(({ item, originalIndex }, index) => {
              const link = document.createElement('a');
              link.className = 'favorite-tile';
              link.href = `group.html?g=favorites&p=${originalIndex + 1}`;
              link.dataset.favoriteIndex = String(originalIndex);
              link.dataset.aspect = String(getAspect(item));
              link.dataset.tileSlot = String(tileSlot);
              tileSlot += 1;
              link.style.setProperty('--tile-weight', String(getAspect(item)));
              link.setAttribute(
                'aria-label',
                `${item.sourceGroupName || 'Favorite'} photo ${originalIndex + 1}`
              );

              const img = document.createElement('img');
              img.loading = rowIndex === 0 && index < 3 ? 'eager' : 'lazy';
              img.decoding = 'async';
              img.fetchPriority = rowIndex === 0 && index < 2 ? 'high' : 'auto';
              img.alt = '';
              img.src = PhotoShare.relativeAsset(item.thumb || item.src);
              img.style.objectPosition = getObjectPosition(item, index + rowIndex);

              link.append(img);
              rowEl.appendChild(link);
            });

            favoritesGridEl.appendChild(rowEl);
          });
        }
      });
    </script>
  </body>
</html>
